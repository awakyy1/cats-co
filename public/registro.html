<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cats&Co - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header>
        <img id="gatinho" src="imagens/gatinho.png" alt="Gatinho andando">
        <img id="logo" src="imagens/catsco.png" alt="Logo do Site">
    </header>
    <div class="div-centralizada registro-container">
        <p id="auth-message" role="alert" hidden></p>
        <form id="registroForm" method="POST" action="/register">
            <div class="mb-3">
                <label for="nomeInput" class="form-label">Name</label>
                <input type="text" class="form-control" id="nomeInput" name="nome" minlength="2" maxlength="80" required>
            </div>
            <div class="mb-3">
                <label for="nicknameInput" class="form-label">Nickname</label>
                <input type="text" class="form-control" id="nicknameInput" name="nickname" minlength="3" maxlength="24" pattern="[A-Za-z0-9_-]+" required>
            </div>
            <div class="mb-3">
                <label for="emailInput" class="form-label">Email</label>
                <input type="email" class="form-control" id="emailInput" name="email" required>
            </div>
            <div class="mb-3">
                <label for="senhaInput" class="form-label">Password</label>
                <input type="password" class="form-control" id="senhaInput" name="senha" minlength="10" maxlength="128" required>
            </div>
            <div class="mb-3">
                <label for="corInput" class="form-label">Chat color</label>
                <input type="color" class="form-control" id="corInput" name="userColors" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
    <!--Script responsavel pelo funcionamento do bootstrap-->
    <script src="/auth.js"></script>
</body>
</html>
